<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MiniCraft</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; font-family: system-ui, sans-serif; user-select: none; }
  canvas#view { display: block; width: 100%; height: 100%; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; }
  #crosshair:before, #crosshair:after { content: ""; position: absolute; background: #fff; mix-blend-mode: difference; }
  #crosshair:before { left: 9px; top: 0; width: 2px; height: 20px; }
  #crosshair:after { left: 0; top: 9px; width: 20px; height: 2px; }
  #hotbar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; background: rgba(0,0,0,.45); border-radius: 6px; }
  .slot { position: relative; width: 48px; height: 48px; border: 3px solid #444; background: #222; box-sizing: border-box; }
  .slot.sel { border-color: #fff; }
  .slot canvas { width: 100%; height: 100%; display: block; }
  .slot .num { position: absolute; left: 2px; top: 0; font-size: 11px; color: #fff; text-shadow: 1px 1px #000; }
  .slot .count, .islot .count, .cursorItem .count { position: absolute; right: 2px; bottom: 0; font: bold 13px monospace; color: #fff; text-shadow: 1px 1px #000; }
  #inventory { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
  #invPanel { background: #c6c6c6; border: 4px solid #373737; border-radius: 6px; padding: 14px 18px 12px; color: #222; box-shadow: 0 10px 40px rgba(0,0,0,.6); max-width: 560px; }
  .invTitle { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .invTitle h2 { margin: 0; font-size: 18px; }
  #modeBtn { font: 600 12px system-ui; padding: 5px 10px; background: #4a9a3a; color: #fff; border: 2px solid #2d6a22; border-radius: 4px; cursor: pointer; }
  .invLabel { font-size: 12px; margin: 10px 0 4px; color: #333; }
  .invHint { font-size: 11px; color: #444; margin-top: 12px; line-height: 1.4; }
  .grid { display: grid; grid-template-columns: repeat(9, 48px); gap: 3px; }
  .islot { position: relative; width: 48px; height: 48px; box-sizing: border-box; background: #8b8b8b; border: 2px solid; border-color: #373737 #fff #fff #373737; }
  .islot:hover { background: #a9a9a9; }
  .islot canvas, .cursorItem canvas { width: 100%; height: 100%; display: block; pointer-events: none; }
  .cursorItem { position: fixed; width: 44px; height: 44px; display: none; pointer-events: none; z-index: 30; }
  #tooltip { position: fixed; display: none; padding: 4px 8px; background: rgba(20,10,40,.92); color: #fff; font-size: 13px; border: 1px solid #5a3a9a; border-radius: 3px; pointer-events: none; z-index: 31; white-space: nowrap; }
  #info { position: fixed; left: 8px; top: 6px; color: #fff; font: 12px monospace; text-shadow: 1px 1px #000; white-space: pre; pointer-events: none; }
  #water { position: fixed; inset: 0; background: rgba(20,80,170,.38); display: none; pointer-events: none; }
  #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 16px; text-shadow: 1px 1px #000; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.55); color: #fff; text-align: center; cursor: pointer; }
  #overlay h1 { font-size: 56px; margin: 0 0 8px; letter-spacing: 2px; text-shadow: 3px 3px #000; }
  #overlay p { margin: 4px 0; font-size: 15px; opacity: .9; }
  #overlay .play { margin-top: 18px; padding: 10px 28px; background: #4a9a3a; border: 2px solid #fff; font-size: 18px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="crosshair"></div>
<div id="info"></div>
<div id="toast"></div>
<div id="water"></div>
<div id="hotbar"></div>
<div id="inventory"><div id="invPanel"></div></div>
<div id="tooltip"></div>
<div id="overlay">
  <h1>MiniCraft</h1>
  <p id="status">Generando mundo...</p>
  <p>WASD mover &nbsp;·&nbsp; Espacio saltar &nbsp;·&nbsp; Shift correr</p>
  <p>Click izq. mantenido: romper &nbsp;·&nbsp; Click der.: poner &nbsp;·&nbsp; 1-9 / rueda: elegir &nbsp;·&nbsp; E: inventario</p>
  <p>F volar &nbsp;·&nbsp; V tercera persona &nbsp;·&nbsp; T hora &nbsp;·&nbsp; G sombras &nbsp;·&nbsp; Esc pausa &nbsp;·&nbsp; F12 consola</p>
  <div class="play" id="playBtn" style="display:none">Click para jugar</div>
</div>

<script src="node_modules/three/build/three.min.js"></script>
<script src="src/config.js"></script>
<script src="src/textures.js"></script>
<script src="src/scene.js"></script>
<script src="src/world.js"></script>
<script src="src/sky.js"></script>
<script src="src/effects.js"></script>
<script src="src/character.js"></script>
<script src="src/inventory.js"></script>
<script src="src/game.js"></script>
</body>
</html>
